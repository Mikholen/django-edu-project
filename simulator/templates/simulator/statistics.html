{% extends 'base.html' %}

{% block title %}Статистика проекта{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-4">📊 Статистика PhysLab</h1>
    <p class="lead text-muted">Обзор учебных материалов</p>
</div>

<div class="row text-center">
    <div class="col-md-6 mb-4">
        <div class="card border-primary shadow-sm">
            <div class="card-body">
                <h2 class="card-title text-primary">{{ total_tasks }}</h2>
                <p class="card-text fw-bold">Доступно задач</p>
            </div>
        </div>
    </div>
    <div class="col-md-6 mb-4">
        <div class="card border-success shadow-sm">
            <div class="card-body">
                <h2 class="card-title text-success">100%</h2>
                <p class="card-text fw-bold">Доступность сервиса</p>
            </div>
        </div>
    </div>
</div>

<div class="mt-4">
    <a href="{% url 'task_list' %}" class="btn btn-secondary">← Вернуться к списку задач</a>
</div>
{% endblock %}
