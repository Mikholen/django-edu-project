{% extends 'base.html' %}

{% block title %}Список задач{% endblock %}

{% block content %}
    <h1 class="mb-4">Доступные задачи</h1>
    <div class="list-group">
        {% for task in tasks %}
            <div class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="mb-1">{{ task.title }}</h5>
                </div>
                <a href="{% url 'task_detail' task.id %}" class="btn btn-primary">Решить</a>
            </div>
        {% empty %}
            <p class="text-muted">Задач пока нет. Добавьте их в админке!</p>
        {% endfor %}
    </div>
{% endblock %}
