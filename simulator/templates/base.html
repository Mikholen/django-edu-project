<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}PhysLab{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'task_list' %}">🔭 PhysLab</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'task_list' %}">Задачи</a>
                <a class="nav-link" href="{% url 'statistics' %}">Статистика</a>
                <a class="nav-link" href="{% url 'register' %}">Регистрация</a>

        </div>

        <small>&copy; 2026 Проект по физике на Django</small>
    </footer>
